# gitleaks configuration for CI secret scanning.
#
# Extends the built-in gitleaks ruleset (useDefault = true) and adds a narrow
# allowlist for unit-test fixture files containing deliberately fake
# secret-shaped strings (e.g. AWS's documented example key
# AKIAIOSFODNN7EXAMPLE, "sk-1234567890abcdef", "xoxb-1234567890-...") used to
# test the secret-redaction functions. They are not real credentials —
# allowlisting the paths prevents false positives without weakening detection
# anywhere else in the repo.
[extend]
useDefault = true

[allowlist]
description = "Unit/integration test fixtures: fake secret-shaped strings, not real credentials"
paths = [
  '''tests/messages-redaction\.test\.ts''',
  '''tests/provider-config-ui\.test\.ts''',
  '''tests/security\.test\.ts''',
  '''tests/shared\.test\.ts''',
  '''tests/redaction-parity\.test\.ts''',
  # cockpit/ was removed from the tree (d180cc9) but its test fixtures
  # survive in git history, which the full-history CI scan covers.
  '''cockpit/src/lib/redact-client\.test\.ts''',
]
