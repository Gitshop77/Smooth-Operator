# CI workflow — runs lint, tests, extension build, and cockpit type-check on every PR.
#
# Uses npm as the default package manager. All scripts work with `npm run`.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Cancel superseded runs on the same ref so rapid pushes don't spawn
# overlapping full CI (CodeQL + full-history gitleaks are the most expensive).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.0 # actions/checkout v7 (Node 24 runtime; dependabot PR #36)

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0 # actions/setup-node v7 (Node 24 runtime; dependabot PR #44)
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install mini-services/cowork-events dependencies
        # The root type-check (npx tsc --noEmit) and the cowork-events
        # test suite both import the mini-service source, which in turn imports
        # socket.io / z-ai-web-dev-sdk resolved from
        # mini-services/cowork-events/node_modules. Those deps must be
        # installed BEFORE the root tsc and vitest steps, otherwise CI fails
        # with "Cannot find module 'socket.io'" / "Cannot find module
        # 'z-ai-web-dev-sdk'" even though it passes locally (where the deps
        # are already present). This is why the install lives here and not
        # only in the later audit step.
        working-directory: mini-services/cowork-events
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Type-check root TypeScript
        run: npx tsc --noEmit

      - name: Run tests with coverage gate
        # Run the suite under v8 coverage and enforce the thresholds declared
        # in vitest.config.ts; a PR that drops coverage below the baseline fails CI.
        run: npx vitest run --coverage

      - name: verify extension build regenerates cleanly
        run: |
          # ------------------------------------------------------------------
          # ARTIFACT PROVENANCE
          # The entire chrome-extension/ output directory is gitignored (it is
          # regenerated from src/extension/ by `npm run build:extension`). It is
          # NOT committed to the repo. Published releases MUST therefore be
          # rebuilt from the verified commit — never ship hand-edited or stale
          # bundles. Because the output is fully gitignored, there is nothing to
          # `git diff` against, so this step instead asserts that regeneration
          # from the current source produces a COMPLETE, VALID extension bundle.
          # ------------------------------------------------------------------
          # Always regenerate the bundles from src/extension/ so the checks
          # below reflect the current source, not a stale checkout.
          npm run build:extension

          # The generated .js entry bundles and chunks/ are gitignored (esbuild
          # ESM code-split output). We cannot diff them, but we DO assert they
          # were produced so the build didn't silently no-op.
          if [ -z "$(ls chrome-extension/*.js 2>/dev/null)" ]; then
            echo "ERROR: build:extension produced no chrome-extension/*.js bundles."
            exit 1
          fi
          if [ ! -d chrome-extension/chunks ]; then
            echo "ERROR: build:extension produced no chrome-extension/chunks/ directory."
            exit 1
          fi

          # Static assets (manifest, HTML, CSS, icons) are copied verbatim from
          # src/extension/ by the build. Assert they exist in the regenerated
          # output so a missing/misnamed source asset fails CI rather than
          # shipping a broken extension. The manifest must also be valid JSON
          # with a service_worker entry (MV3 background).
          for f in manifest.json sidepanel.html sidepanel.css options.html options.css; do
            if [ ! -f "chrome-extension/$f" ]; then
              echo "ERROR: build:extension did not produce chrome-extension/$f."
              exit 1
            fi
          done
          if [ ! -f chrome-extension/icons/icon-128.png ]; then
            echo "ERROR: build:extension did not produce chrome-extension/icons/icon-128.png."
            exit 1
          fi
          node -e "const m=require('./chrome-extension/manifest.json'); if(!m.background||!m.background.service_worker) { console.error('ERROR: manifest.json missing background.service_worker'); process.exit(1); } console.log('manifest OK:', m.manifest_version, m.name);"

      - name: Audit root dependencies
        # High-severity advisories intentionally FAIL CI (no `|| true`), so
        # vulnerable dependencies cannot merge green. Moderate stays covered by
        # dependency-review.yml. This is a hard gate; do not append `|| true`.
        # `npm audit signatures` additionally verifies registry signatures so a
        # tampered package with no published advisory is still blocked.
        run: npm audit --audit-level=high && npm audit signatures

      - name: Audit mini-services/cowork-events dependencies
        working-directory: mini-services/cowork-events
        # Deps installed in the earlier "Install mini-services/cowork-events
        # dependencies" step; this is signal-only (see "Audit root
        # dependencies"), PR scope is gated by dependency-review.yml.
        run: npm audit --audit-level=high && npm audit signatures

      - name: Type-check mini-services/cowork-events
        # The WebSocket mini-service ships to production paths but previously
        # had no static analysis in CI. Type-check it from the repo root (where
        # typescript is installed) against its own tsconfig so type errors are
        # caught on every PR. NOTE: lint/test/build coverage for this service
        # still requires scripts in mini-services/cowork-events/package.json
        # (owned outside this batch).
        run: npx tsc --noEmit -p mini-services/cowork-events/tsconfig.json

  cockpit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    # DATABASE_URL is supplied at JOB level (not per-step) so every cockpit step
    # that imports `prisma.config.ts` — `db:generate`, `db:apply`, `tsc`, `lint`,
    # `build`, and the `test` suite — has the datasource URL. Prisma 7 moved the
    # connection URL out of `schema.prisma` into `prisma.config.ts`, which reads
    # it eagerly via `env('DATABASE_URL')` at load time. Without it, `prisma
    # generate` dies with "Cannot resolve environment variable: DATABASE_URL"
    # before any command runs. The cockpit's `.env` is gitignored, so CI must
    # inject this here. A throwaway SQLite file is fine for CI.
    env:
      DATABASE_URL: file:./db/cowork.db
    defaults:
      run:
        working-directory: cockpit
    steps:
      - uses: actions/checkout@v7.0.0 # actions/checkout v7 (Node 24 runtime; dependabot PR #36)

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0 # actions/setup-node v7 (Node 24 runtime; dependabot PR #44)
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: cockpit/package-lock.json

      - name: Install cockpit dependencies
        run: npm ci

      - name: Audit cockpit dependencies
        # Signal-only (see the root "Audit root dependencies" step); PR-introduced
        # vulnerabilities are gated by dependency-review.yml. `npm audit
        # signatures` verifies registry signatures as an additional hard gate.
        run: npm audit --audit-level=high && npm audit signatures

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Apply database schema (verify it applies)
        # Apply the committed Prisma migration to a throwaway local SQLite DB so a
        # schema that fails to apply is caught in CI AND the tables actually exist
        # for the cockpit tests below. A migration now lives under
        # cockpit/prisma/migrations/, so we use `prisma migrate deploy` (via
        # `npm run db:apply`) rather than the older `db push` drift approach.
        # cockpit uses sqlite (DATABASE_URL is set at the job level);
        # no external DB service required.
        run: npm run db:apply

      - name: Type-check cockpit
        run: npx tsc --noEmit

      - name: Lint cockpit
        run: npm run lint

      - name: Run cockpit tests
        # Run the cockpit test suite (middleware.test.ts, route.test.ts, etc.)
        # after db:generate/db:apply (the Prisma client may be required by the
        # tests) and before the production build. DATABASE_URL is set at the job
        # level so tests that touch Prisma have a DB target.
        run: npm test

      - name: Build cockpit
        run: npm run build

  # Secret scanning — fail the build if a real secret is committed.
  # Runs gitleaks against the full git history on every PR and push.
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.0 # actions/checkout v7 (Node 24 runtime; dependabot PR #36)
        with:
          fetch-depth: 0

      - name: Run gitleaks secret scan
        # gitleaks exits non-zero on a detected leak, so the step (and the
        # build) fails on a committed real secret. The action does NOT accept an
        # `args` input (that caused the "Unexpected input(s) 'args'" failure);
        # configuration is supplied via env instead. GITLEAKS_CONFIG points at
        # our ruleset (built-in rules + a narrow allowlist for the redaction
        # test fixtures). fail-on-leak is the action's default behavior.
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # gitleaks-action (Node 24 runtime; dependabot PR #35)
        env:
          GITLEAKS_CONFIG: .github/gitleaks.toml

  # SAST: GitHub CodeQL security-and-quality scan for javascript-typescript.
  codeql:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v7.0.0 # actions/checkout v7 (Node 24 runtime; dependabot PR #36)
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4 # github/codeql-action v4 (Node 24 runtime)
        with:
          languages: javascript-typescript
          queries: security-and-quality
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4 # github/codeql-action v4 (Node 24 runtime)
