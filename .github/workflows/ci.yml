# CI workflow — runs lint, tests, and extension build on every PR.
#
# Uses npm as the default package manager. All scripts work with `npm run`.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Cancel superseded runs on the same ref so rapid pushes don't spawn
# overlapping full CI (the full-history gitleaks scan is the most expensive step).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # actions/checkout v7.0.0 (full commit SHA pin)

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # actions/setup-node v7.0.0 (full commit SHA pin)
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Type-check root TypeScript
        run: npx tsc --noEmit

      - name: Run tests with coverage gate
        # Run the test suite under v8 coverage and enforce the thresholds
        # declared in vitest.config.ts; a PR that drops coverage below the
        # baseline fails CI.
        run: npx vitest run --coverage

      - name: Build extension
        run: npm run build:extension

      - name: Verify build output
        run: |
          cd chrome-extension
          # JS entry bundles
          for f in background.js content.js content-main.js sidepanel.js options.js; do
            [ ! -s "$f" ] && echo "ERROR: $f missing or empty" && exit 1
          done
          # Static assets
          for f in manifest.json sidepanel.html sidepanel.css options.html options.css; do
            [ ! -s "$f" ] && echo "ERROR: $f missing or empty" && exit 1
          done
          # Icons
          for s in 16 32 48 128; do
            [ ! -s "icons/icon-${s}.png" ] && echo "ERROR: icons/icon-${s}.png missing or empty" && exit 1
          done
          # License files
          for f in LICENSE LICENSE-APACHE LICENSE-MIT NOTICE; do
            [ ! -s "$f" ] && echo "ERROR: $f missing or empty" && exit 1
          done
          # Manifest validity
          node -e "const m=require('./manifest.json'); if(!m.background?.service_worker) process.exit(1)"
          # MV3 module service workers disallow native import(); esbuild inlines
          # every statically-resolvable import (splitting: false), but the
          # transformers web-bundle loader's computed-specifier `import(a)`
          # survives verbatim. It is never executed in the service worker (Local
          # Vision runs in DOM contexts), but any ADDITIONAL dynamic import
          # would throw at runtime — fail on a second occurrence.
          if [ "$(grep -c 'await import(' background.js)" -gt 1 ]; then
            echo "ERROR: background.js contains a native import() call" && exit 1
          fi

      - name: Audit root dependencies
        # High-severity advisories intentionally FAIL CI (no `|| true`), so
        # vulnerable dependencies cannot merge green. Moderate stays covered by
        # dependency-review.yml. This is a hard gate; do not append `|| true`.
        # `npm audit signatures` additionally verifies registry signatures so a
        # tampered package with no published advisory is still blocked.
        run: npm audit --audit-level=high && npm audit signatures

  # Secret scanning — fail the build if a real secret is committed.
  # Runs gitleaks against the full git history on every PR and push.
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # actions/checkout v7.0.0
        with:
          fetch-depth: 0

      - name: Run gitleaks secret scan
        # gitleaks exits non-zero on a detected leak, so the step (and the
        # build) fails on a committed real secret. The action does NOT accept an
        # `args` input (that caused the "Unexpected input(s) 'args'" failure);
        # configuration is supplied via env instead. GITLEAKS_CONFIG points at
        # our ruleset (built-in rules + a narrow allowlist for the redaction
        # test fixtures). fail-on-leak is the action's default behavior.
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # gitleaks-action (Node 24 runtime; dependabot PR #35)
        env:
          GITLEAKS_CONFIG: .github/gitleaks.toml
