# CI workflow — runs lint, tests, extension build, and cockpit type-check on every PR.
#
# Uses npm as the default package manager. All scripts work with `npm run`.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # PIN TO A VERIFIED SHA (actions/checkout@v4 tag)

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # PIN TO A VERIFIED SHA (actions/setup-node@v4 tag)
        with:
          node-version: '20.18.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Type-check root TypeScript
        run: npx tsc --noEmit

      - name: Run tests with coverage gate
        # Run the suite under v8 coverage and enforce the thresholds declared
        # in vitest.config.ts; a PR that drops coverage below the baseline fails CI.
        run: npx vitest run --coverage

      - name: verify extension build is in sync (tracked static files only)
        run: |
          # ------------------------------------------------------------------
          # ARTIFACT PROVENANCE
          # chrome-extension/*.js and chrome-extension/chunks/ are gitignored
          # (esbuild ESM code-split output). They are NOT committed to the repo.
          # Published releases MUST therefore be rebuilt from the verified
          # commit via `npm run build:extension` — never ship hand-edited or
          # stale bundles. The checks below assert (a) the build succeeded and
          # (b) the committed static files (manifest/html/css) are unchanged so
          # the tracked inputs still match src/extension/.
          # ------------------------------------------------------------------
          # Always regenerate the bundles from src/extension/ so the comparison
          # below reflects the current source, not a stale checkout.
          npm run build:extension

          # The generated .js entry bundles and chunks/ are gitignored (esbuild
          # ESM code-split output). We cannot diff them, but we DO assert they
          # were produced so the build didn't silently no-op.
          if [ -z "$(ls chrome-extension/*.js 2>/dev/null)" ]; then
            echo "ERROR: build:extension produced no chrome-extension/*.js bundles."
            exit 1
          fi
          if [ ! -d chrome-extension/chunks ]; then
            echo "ERROR: build:extension produced no chrome-extension/chunks/ directory."
            exit 1
          fi

          # Diff ONLY the tracked static files (manifest.json, *.html, *.css).
          # The generated .js bundles and chunks/ are intentionally excluded —
          # they are gitignored/untracked, so source/artifact drift there is
          # invisible to `git diff` by design.
          if ! git diff --exit-code -- \
              chrome-extension/manifest.json \
              $(git ls-files 'chrome-extension/*.html' 'chrome-extension/*.css'); then
            echo "ERROR: chrome-extension/ static files are out of sync with src/extension/."
            echo "Run 'npm run build:extension' and commit the result."
            exit 1
          fi

      - name: Audit root dependencies
        run: npm audit --audit-level=moderate

      - name: Audit mini-services/cowork-events dependencies
        working-directory: mini-services/cowork-events
        run: npm ci && npm audit --audit-level=moderate

      - name: Type-check mini-services/cowork-events
        # The WebSocket mini-service ships to production paths but previously
        # had no static analysis in CI. Type-check it from the repo root (where
        # typescript is installed) against its own tsconfig so type errors are
        # caught on every PR. NOTE: lint/test/build coverage for this service
        # still requires scripts in mini-services/cowork-events/package.json
        # (owned outside this batch).
        run: npx tsc --noEmit -p mini-services/cowork-events/tsconfig.json

  cockpit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: cockpit
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # PIN TO A VERIFIED SHA (actions/checkout@v4 tag)

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # PIN TO A VERIFIED SHA (actions/setup-node@v4 tag)
        with:
          node-version: '20.18.0'
          cache: 'npm'
          cache-dependency-path: cockpit/package-lock.json

      - name: Install cockpit dependencies
        run: npm ci

      - name: Audit cockpit dependencies
        run: npm audit --audit-level=moderate

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Apply database schema (verify it applies)
        # Apply the Prisma schema to a throwaway local SQLite DB so a schema
        # that fails to apply is caught in CI. cockpit uses sqlite
        # (DATABASE_URL=file:./db/cowork.db); no external DB service required.
        env:
          DATABASE_URL: file:./db/cowork.db
        run: npm run db:apply

      - name: Type-check cockpit
        run: npx tsc --noEmit

      - name: Lint cockpit
        run: npm run lint

      - name: Run cockpit tests
        # Run the cockpit test suite (middleware.test.ts, route.test.ts, etc.)
        # after db:generate/db:apply (the Prisma client may be required by the
        # tests) and before the production build. DATABASE_URL is supplied so
        # tests that touch Prisma have a DB target.
        env:
          DATABASE_URL: file:./db/cowork.db
        run: npm test

      - name: Build cockpit
        run: npm run build

  # Secret scanning — fail the build if a real secret is committed.
  # Runs gitleaks against the full git history on every PR and push.
  secret-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@002191b3668e769a76cadbdb5cc75d0e1fba2a17 # PIN TO A VERIFIED SHA (was actions/checkout@v4)
        with:
          fetch-depth: 0

      - name: Run gitleaks secret scan
        # gitleaks exits non-zero on a detected leak, so the step (and the
        # build) fails on a committed real secret. `--redact` masks secret
        # values in any logs/artifacts. fail: true is gitleaks' default
        # behavior when a leak is found.
        uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # PIN TO A VERIFIED SHA (gitleaks/gitleaks-action@v2 tag)
        with:
          args: --redact

  # SAST: GitHub CodeQL security-and-quality scan for javascript-typescript.
  codeql:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # PIN TO A VERIFIED SHA (actions/checkout@v4 tag)
      - name: Initialize CodeQL
        uses: github/codeql-action/init@641a925cfafe92d0fdf8b239ba4053e3f8d99d6d # PIN TO A VERIFIED SHA (github/codeql-action/init@v3 tag)
        with:
          languages: javascript-typescript
          queries: security-and-quality
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@641a925cfafe92d0fdf8b239ba4053e3f8d99d6d # PIN TO A VERIFIED SHA (github/codeql-action/analyze@v3 tag)
