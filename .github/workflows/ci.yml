name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.23.2'
          cache: npm
      - run: npm install --global npm@10.9.8
      - run: |
          test "$(node --version)" = "v22.23.2"
          test "$(npm --version)" = "10.9.8"
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:coverage
      - run: npm run dead-code
      - run: mkdir -p artifacts && npm run benchmark:mcp -- --iterations 30 --output artifacts/benchmark-source-disabled.json
      - run: npm run build
      - run: npm run package:smoke:install
      - run: npm run benchmark:mcp:dist -- --iterations 30 --output artifacts/benchmark-bundle-disabled.json
      - run: npm audit --audit-level=high
      - run: npm audit signatures
      - name: Upload disabled benchmark reports
        if: always()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: benchmark-disabled-${{ github.run_id }}
          path: artifacts/*.json
          if-no-files-found: warn

  live-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.23.2'
          cache: npm
      - run: npm install --global npm@10.9.8
      - run: npm ci
      - run: npm run build
      - name: Run Linux live browser contract
        run: |
          mkdir -p artifacts
          SMOOTH_OPERATOR_LIVE_DIAGNOSTICS_PATH=artifacts/live-browser.json npm run test:browser:live
      - name: Run source live benchmark
        run: |
          mkdir -p artifacts
          BROWSER="$(command -v google-chrome || command -v google-chrome-stable || command -v brave-browser || command -v brave || command -v chromium || command -v chromium-browser || command -v microsoft-edge || command -v microsoft-edge-stable)"
          SMOOTH_OPERATOR_BENCHMARK_BROWSER_EXECUTABLE="$BROWSER" npm run benchmark:mcp:live -- --iterations 3 --output artifacts/benchmark-source-live.json
      - name: Run bundled live benchmark
        run: |
          BROWSER="$(command -v google-chrome || command -v google-chrome-stable || command -v brave-browser || command -v brave || command -v chromium || command -v chromium-browser || command -v microsoft-edge || command -v microsoft-edge-stable)"
          SMOOTH_OPERATOR_BENCHMARK_BROWSER_EXECUTABLE="$BROWSER" npm run benchmark:mcp:live -- --dist --iterations 3 --output artifacts/benchmark-bundle-live.json
      - name: Upload live benchmark and diagnostics
        if: always()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: benchmark-live-${{ github.run_id }}
          path: artifacts/*.json
          if-no-files-found: warn

  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.23.2'
          cache: npm
      - run: npm install --global npm@10.9.8
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7
        env:
          GITLEAKS_CONFIG: .github/gitleaks.toml
