# Dependency Review — fails PRs that introduce vulnerable dependency changes.
#
# Complements Dependabot (`.github/dependabot.yml`): Dependabot proposes updates,
# this workflow blocks PRs that add a dependency with a moderate-or-higher advisory
# or a license the org disallows. Runs on every PR that touches a lockfile.

name: Dependency Review

on:
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7.0.0 # actions/checkout v7 (Node 24 runtime; dependabot PR #36)

      - name: Dependency Review
        uses: actions/dependency-review-action@v5.0.0 # dependency-review-action v5 (Node 24 runtime; dependabot PR #37)
        with:
          # Block PRs that introduce MODERATE or higher severity advisories.
          fail-on-severity: moderate
          # Block PRs that introduce a dependency under a license the org disallows.
          deny-licenses: GPL-3.0, AGPL-3.0
          # All three npm workspaces share the root + their own lockfiles.
          fail-on-scopes: development, runtime
