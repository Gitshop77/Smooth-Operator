name: Refresh models.dev catalog

on:
  schedule:
    - cron: "17 6 * * 1" # weekly, Mon 06:17 UTC (avoid :00)
  workflow_dispatch: {}

# `contents: write` lets the bot push a branch; `pull-requests: write` is
# required for `gh pr create` to actually open the PR on the same repo.
permissions:
  contents: write
  pull-requests: write

env:
  # Canonical models.dev dataset (TOML source of truth). Corrected by resolving
  # the upstream owner: the repo lives under `anomalyco` (redirects from the
  # former `sst/models.dev`). Change here if it moves.
  MODELS_DEV_REPO: "https://github.com/anomalyco/models.dev"

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Configure git (github-actions[bot])
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

      - name: Clone models.dev dataset
        run: |
          rm -rf /tmp/models.dev
          if ! git clone --depth 1 "$MODELS_DEV_REPO" /tmp/models.dev; then
            echo "clone failed, skipping"
            echo "CLONE_OK=false" >> "$GITHUB_ENV"
          else
            echo "CLONE_OK=true" >> "$GITHUB_ENV"
          fi

      - name: Regenerate catalog
        if: env.CLONE_OK == 'true'
        run: MODELS_DEV_ROOT=/tmp/models.dev npx tsx scripts/build-models-catalog.ts

      - name: Type-check regenerated catalog
        if: env.CLONE_OK == 'true'
        run: npx tsc --noEmit

      - name: Run tests
        if: env.CLONE_OK == 'true'
        run: npx vitest run

      - name: Check diff and open PR if changed
        if: env.CLONE_OK == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet src/lib/agent/llm/catalog-bundled.ts; then
            echo "Catalog unchanged — nothing to do."
            exit 0
          fi

          BRANCH="chore/refresh-models-catalog"
          git checkout -B "$BRANCH"
          git add src/lib/agent/llm/catalog-bundled.ts
          git commit -m "chore: refresh models.dev catalog (weekly)"
          git push --force origin "$BRANCH"

          gh pr create \
            --title "chore: refresh models.dev catalog (weekly)" \
            --body "Automated weekly refresh of the bundled models.dev catalog.

          Regenerated \`src/lib/agent/llm/catalog-bundled.ts\` from the upstream
          [models.dev]($MODELS_DEV_REPO) dataset. This keeps the offline catalog
          current without committing a multi-MB diff by hand.

          - Source: $MODELS_DEV_REPO
          - Generator: \`npx tsx scripts/build-models-catalog.ts\`" \
            || echo "PR creation failed"
