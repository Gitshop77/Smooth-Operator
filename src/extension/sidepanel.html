<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark light" />
  <title>Open Cowork</title>
  <link rel="stylesheet" href="sidepanel.css" />
</head>
<body>
  <header>
    <div class="logo">
      <svg class="mark" width="28" height="28" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Open Cowork">
        <defs>
          <linearGradient id="cwMarkG" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#8B7BF2"/>
            <stop offset="1" stop-color="#5A49D6"/>
          </linearGradient>
        </defs>
        <rect width="32" height="32" rx="8" fill="url(#cwMarkG)"/>
        <g fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round">
          <line x1="16" y1="16" x2="9" y2="10"/>
          <line x1="16" y1="16" x2="23" y2="11"/>
          <line x1="16" y1="16" x2="16" y2="23"/>
        </g>
        <g fill="#FFFFFF">
          <circle cx="16" cy="16" r="3.5"/>
          <circle cx="9" cy="10" r="2.5"/>
          <circle cx="23" cy="11" r="2.5"/>
          <circle cx="16" cy="23" r="2.5"/>
        </g>
      </svg>
      <div>
        <h1>Open Cowork</h1>
        <p>Planner + navigator</p>
      </div>
    </div>
  </header>

  <main id="chatMessages" class="chat-messages" role="log" aria-label="Chat messages">
    <div class="empty-state">
      <div class="empty-state-title">What can I help you with?</div>
      <div class="empty-state-hint">Describe a task and I'll autonomously navigate, read, and act on web pages for you.</div>
    </div>
  </main>

  <div class="input-bar">
    <input type="text" id="messageInput" class="message-input" placeholder="Type a message..." autocomplete="off" aria-label="Message input" />
    <button type="button" id="sendBtn" class="btn-send" aria-label="Send message">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="22" y1="2" x2="11" y2="13"/>
        <polygon points="22 2 15 22 11 13 2 9 22 2"/>
      </svg>
    </button>
  </div>

  <div class="status-bar">
    <div class="status-left">
      <span class="status-dot" id="statusDot" data-status="idle" aria-hidden="true"></span>
      <span class="status-label" id="statusLabel" aria-live="polite">idle</span>
      <label for="modeSelect" class="sr-only">Agent mode</label>
      <select id="modeSelect" class="mode-select" aria-label="Agent mode">
        <option value="restricted">🔒 Restricted</option>
        <option value="standard" selected>⚡ Standard</option>
        <option value="full_agentic">🤖 Full agentic</option>
      </select>
    </div>
    <div class="status-center">
      <span id="costLabel" class="telemetry">$0.0000</span>
      <span class="telemetry-sep">·</span>
      <span id="tokenLabel" class="telemetry">0 tokens</span>
    </div>
    <button type="button" id="stopBtn" class="btn-stop" disabled aria-label="Stop agent">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><rect x="4" y="4" width="16" height="16" rx="2"/></svg>
      <span>Stop</span>
    </button>
  </div>

  <div class="takeover-banner" id="takeoverBanner" hidden>
    <div class="takeover-body">
      <div class="takeover-title">Agent paused — human takeover</div>
      <div class="takeover-reason" id="takeoverReason"></div>
      <div class="takeover-hint">Perform the action manually, then click Resume.</div>
    </div>
    <button type="button" class="btn btn-primary btn-resume" id="resumeBtn">Resume</button>
  </div>

  <button type="button" id="openOptions" class="btn-settings" aria-label="Settings">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="3"/>
      <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
    </svg>
  </button>
  <script src="sidepanel.js"></script>
</body>
</html>
