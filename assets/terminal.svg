<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 220" width="680" height="220">
  <defs>
    <clipPath id="screen">
      <rect x="0" y="0" width="680" height="220" rx="10"/>
    </clipPath>
  </defs>

  <g clip-path="url(#screen)">
    <!-- Terminal background -->
    <rect width="680" height="220" rx="10" fill="#1a1a2e"/>

    <!-- Title bar -->
    <rect width="680" height="36" rx="10" fill="#16213e"/>
    <rect y="10" width="680" height="26" fill="#16213e"/>
    <circle cx="20" cy="18" r="6" fill="#ff5f57"/>
    <circle cx="40" cy="18" r="6" fill="#ffbd2e"/>
    <circle cx="60" cy="18" r="6" fill="#28ca41"/>
    <text x="340" y="22" text-anchor="middle" font-family="monospace" font-size="12" fill="#8892b0">Terminal</text>

    <!-- Command 1: git clone -->
    <text x="20" y="72" font-family="'SF Mono', 'Menlo', 'Monaco', 'Courier New', monospace" font-size="14" fill="#28ca41">
      $
      <animate attributeName="opacity" values="1;1;0;1" dur="1.2s" repeatCount="indefinite"/>
    </text>
    <text x="40" y="72" font-family="'SF Mono', 'Menlo', 'Monaco', 'Courier New', monospace" font-size="14" fill="#e6e6e6">
      git clone https://github.com/Gitshop77/open-cowork-chrome-extension.git
      <animate attributeName="opacity" values="0;1" dur="0.01s" fill="freeze"/>
      <animate attributeName="opacity" values="0;1" keyTimes="0;1" dur="0.01s" fill="freeze"/>
    </text>

    <!-- Command 2: cd -->
    <text x="20" y="102" font-family="'SF Mono', 'Menlo', 'Monaco', 'Courier New', monospace" font-size="14" fill="#28ca41">$</text>
    <text x="40" y="102" font-family="'SF Mono', 'Menlo', 'Monaco', 'Courier New', monospace" font-size="14" fill="#e6e6e6">cd open-cowork-chrome-extension</text>

    <!-- Command 3: npm install -->
    <text x="20" y="132" font-family="'SF Mono', 'Menlo', 'Monaco', 'Courier New', monospace" font-size="14" fill="#28ca41">$</text>
    <text x="40" y="132" font-family="'SF Mono', 'Menlo', 'Monaco', 'Courier New', monospace" font-size="14" fill="#e6e6e6">npm install</text>

    <!-- Command 4: npm run build -->
    <text x="20" y="162" font-family="'SF Mono', 'Menlo', 'Monaco', 'Courier New', monospace" font-size="14" fill="#28ca41">$</text>
    <text x="40" y="162" font-family="'SF Mono', 'Menlo', 'Monaco', 'Courier New', monospace" font-size="14" fill="#e6e6e6">npm run build:all</text>

    <!-- Blinking cursor -->
    <rect x="215" y="148" width="8" height="16" fill="#28ca41">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>

    <!-- Comment -->
    <text x="232" y="162" font-family="'SF Mono', 'Menlo', 'Monaco', 'Courier New', monospace" font-size="14" fill="#8892b0"># builds the extension</text>
  </g>
</svg>
